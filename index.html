<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Islam Medical Complex — Excellence in Modern Healthcare</title>
    <meta name="description" content="Islam Medical Complex — A state-of-the-art multi-department medical center delivering compassionate, personalized clinical care and advanced diagnostics." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Merriweather:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/sf-pro-display" rel="stylesheet">
    <script>
    (function () {
      var root = document.documentElement;
      var tier = 'full';
      try {
        var cores = navigator.hardwareConcurrency || 8;
        var mem = navigator.deviceMemory || 8;
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var save = navigator.connection && navigator.connection.saveData;
        if (reduce || save || cores <= 2 || mem <= 2) tier = 'none';
        else if (cores <= 4 || mem <= 4) tier = 'lite';
      } catch (e) {}
      root.setAttribute('data-motion', tier);
      if (tier === 'none') return;
      var sd = false;
      try { sd = !!(window.CSS && CSS.supports && CSS.supports('animation-timeline: view()')); } catch (e) {}
      root.classList.add(sd ? 'sd' : 'fb');
    })();
    </script>
  </head>
  <body class="bg-[#F4F2EE] text-[#18181B] antialiased selection:bg-[#C9A8F5] selection:text-[#101012]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
    (function () {
      var root = document.documentElement;
      var sd = root.classList.contains('sd');
      var fb = root.classList.contains('fb');
      if (!sd && !fb) return;

      if (sd) {
        var bar = document.createElement('div');
        bar.className = 'scroll-progress';
        bar.setAttribute('aria-hidden', 'true');
        document.body.appendChild(bar);

        var outs = document.querySelectorAll('[data-stack~="out"]');
        for (var i = 0; i < outs.length; i++) {
          var dim = document.createElement('span');
          dim.className = 'stack-dim';
          dim.setAttribute('aria-hidden', 'true');
          outs[i].appendChild(dim);
        }
      }

      if (fb) {
        var items = document.querySelectorAll('[data-reveal]');
        if (!('IntersectionObserver' in window)) {
          for (var j = 0; j < items.length; j++) items[j].classList.add('is-visible');
          return;
        }
        var io = new IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            if (e.isIntersecting) { e.target.classList.add('is-visible'); io.unobserve(e.target); }
          });
        }, { rootMargin: '0px 0px -10% 0px', threshold: 0.08 });
        for (var k = 0; k < items.length; k++) io.observe(items[k]);
      }
    })();
    </script>
  </body>
</html>
